<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitChord OBS Overlay (Pages Edition)</title>
  <style>
    :root {
      --bg-glass: rgba(14, 16, 26, 0.85);
      --border-glass: rgba(255, 255, 255, 0.12);
      --accent-pink: #ff4081;
      --accent-purple: #9c27b0;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      background: transparent;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      height: 100vh;
      padding: 20px;
    }

    .overlay-card {
      width: 520px;
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-glass);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      position: relative;
      transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
      transform: translateY(120%);
      opacity: 0;
    }

    .overlay-card.visible {
      transform: translateY(0);
      opacity: 1;
    }

    .cover-box {
      position: relative;
      width: 82px;
      height: 82px;
      flex-shrink: 0;
    }

    .cover-img {
      width: 100%;
      height: 100%;
      border-radius: 12px;
      object-fit: cover;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .info-box {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .artist {
      font-size: 0.82rem;
      color: #cbd5e1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }

    .requested-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(145, 70, 255, 0.25);
      border: 1px solid rgba(145, 70, 255, 0.45);
      color: #e0ccff;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 0.72rem;
      font-weight: 600;
    }

    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-bottom-left-radius: 18px;
      border-bottom-right-radius: 18px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #ff4081, #9c27b0, #9146ff);
      transition: width 0.25s linear;
    }

    .roger-toast {
      position: fixed;
      top: 20px;
      left: 20px;
      background: rgba(18, 20, 32, 0.9);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 64, 129, 0.3);
      border-radius: 14px;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      transform: translateY(-100px);
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .roger-toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Alerta Mascote Roger -->
  <div id="rogerToast" class="roger-toast">
    <img src="assets/roger/10_urso_gg.png" alt="Roger" style="width: 42px; height: 42px; object-fit: contain;" />
    <div>
      <div style="font-weight: 700; color: #ff80bf; font-size: 0.86rem;">🎵 Nova música na fila!</div>
      <div id="toastMessage" style="color: #fff; font-size: 0.82rem;">Pedido recebido</div>
    </div>
  </div>

  <!-- Card Principal -->
  <div id="overlayCard" class="overlay-card">
    <div class="cover-box">
      <img id="coverImg" src="assets/roger/roger_logo.png" alt="Capa" class="cover-img" />
    </div>

    <div class="info-box">
      <div id="trackTitle" class="title">Música</div>
      <div id="trackArtist" class="artist">Artista</div>

      <div class="meta-row">
        <div class="requested-badge">
          <span>Pedido por:</span>
          <span id="requestedUser">@streamer</span>
        </div>
        <div id="timeText" style="font-size: 0.72rem; color: #94a3b8;">0:00 / 0:00</div>
      </div>
    </div>

    <div class="progress-bar">
      <div id="progressFill" class="progress-fill"></div>
    </div>
  </div>

  <script src="js/overlay.js"></script>
</body>
</html>
