<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BitChord WebRadio • Twitch Player (GitHub / Cloudflare Pages)</title>
  <link rel="icon" type="image/png" href="assets/roger/roger_logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">

    <!-- Header -->
    <header class="header glass-panel">
      <div class="brand-box">
        <img src="assets/roger/roger_logo.png" alt="Roger Mascote" class="brand-logo" />
        <div>
          <h1 class="brand-title">BitChord WebRadio</h1>
          <div style="display: flex; gap: 8px; align-items: center; margin-top: 4px;">
            <span class="brand-tag">Pages Edition</span>
            <span class="brand-tag" style="background: rgba(255, 64, 129, 0.2); color: #ff80bf;">Mascote Roger</span>
          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px;">
        <div id="twitchStatus" class="status-pill disconnected">
          <span class="dot"></span> Não conectado
        </div>
        <button id="btnCopyOverlay" class="btn" title="Copiar link para o OBS Studio">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 2H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h4v2h8v-2h4c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H4V4h16v12z"/></svg>
          OBS Overlay
        </button>
      </div>
    </header>

    <!-- Twitch Channel Bar -->
    <div class="glass-panel" style="padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; gap: 16px;">
      <div style="display: flex; align-items: center; gap: 12px; flex: 1;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#9146ff"><path d="M11.571 4.714h1.715v5.143H11.57zm4.715 0H18v5.143h-1.714zM6 0L1.714 4.286v15.428h5.143V24l4.286-4.286h3.428L22.286 12V0zm14.571 11.143l-3.428 3.428h-3.429l-3 3v-3H6.857V1.714h13.714z"/></svg>
        <span style="font-weight: 600; font-size: 0.9rem;">Canal da Twitch:</span>
        <input type="text" id="inputChannel" class="input-text" placeholder="Nome do seu canal na Twitch" style="max-width: 280px; padding: 8px 14px;" />
        <button id="btnConnectTwitch" class="btn btn-primary" style="padding: 8px 16px;">Conectar Chat</button>
      </div>
      <div style="font-size: 0.78rem; color: var(--text-muted);">
        O chat ouve comandos <code>!sr link</code> de YouTube e Spotify automaticamente!
      </div>
    </div>

    <!-- Main Grid -->
    <div class="main-grid">

      <!-- Left Column: Player & Controls -->
      <div style="display: flex; flex-direction: column; gap: 24px;">

        <!-- Player Card -->
        <div class="glass-panel player-card">
          <div class="ambient-light"></div>

          <div class="track-hero">
            <div class="cover-wrapper">
              <img id="coverArt" src="assets/roger/roger_logo.png" alt="Capa" class="cover-art" />
              <div id="sourceBadge" class="source-badge" style="display: none;"></div>
            </div>

            <div class="track-meta">
              <div id="trackTitle" class="track-title">Carregando player...</div>
              <div id="trackArtist" class="track-artist">Aguardando músicas...</div>
              <div id="requestedBy" class="requested-tag" style="display: none;"></div>
            </div>
          </div>

          <!-- Progress Bar -->
          <div class="progress-container">
            <div class="progress-bar-wrapper" id="progressWrapper">
              <div class="progress-fill" id="progressBar"></div>
            </div>
            <div class="time-row">
              <span id="currentTime">0:00</span>
              <span id="durationTime">0:00</span>
            </div>
          </div>

          <!-- Controls -->
          <div class="controls-row">
            <div class="main-controls">
              <button id="btnPlayPause" class="btn-play-pause" title="Play/Pause">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
              </button>
              <button id="btnNext" class="btn btn-icon" title="Pular música">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
              </button>
            </div>

            <div class="volume-container">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="color: var(--text-muted);"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/></svg>
              <input type="range" id="volumeSlider" class="volume-slider" min="0" max="100" value="80" />
            </div>
          </div>
        </div>

        <!-- Add Song Form -->
        <div class="glass-panel" style="padding: 24px; display: flex; flex-direction: column; gap: 14px;">
          <div style="font-weight: 700; font-size: 1rem; display: flex; align-items: center; gap: 8px;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="color: var(--accent-pink);"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
            Adicionar Música Manualmente
          </div>
          <div style="display: flex; gap: 10px;">
            <input type="text" id="addInput" class="input-text" placeholder="Cole link do YouTube ou Spotify..." style="flex: 1;" />
            <button id="btnAdd" class="btn btn-primary">Adicionar</button>
          </div>
        </div>

      </div>

      <!-- Right Column: Queue -->
      <div class="glass-panel queue-panel">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <div style="font-weight: 700; font-size: 1.05rem;">
            Fila de Músicas <span id="queueCount" style="color: var(--accent-pink);">(0)</span>
          </div>
          <img src="assets/roger/12_urso_relax.png" alt="Roger" style="width: 38px; height: 38px; object-fit: contain;" />
        </div>

        <div class="queue-list" id="queueList"></div>
      </div>

    </div>

  </div>

  <!-- Contêiner do Player do YouTube IFrame (Oculto) -->
  <div id="ytPlayerContainer">
    <div id="ytPlayer"></div>
  </div>

  <!-- Dependências via CDN (Sem precisar de Node.js no Cloudflare Pages / GitHub Pages) -->
  <script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/1.8.5/tmi.min.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="js/app.js"></script>
</body>
</html>
